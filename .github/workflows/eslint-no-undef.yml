name: ESLint no-undef

on:
  pull_request:
    paths:
      - "src/**/*.{js,jsx}"
      - "eslint.config.js"
      - "vite.config.js"
      - "package.json"
      - "package-lock.json"

jobs:
  no-undef:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/eslint-no-undef.mjs src
