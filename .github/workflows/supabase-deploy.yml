name: Supabase deploy

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "supabase/config.toml"
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ssdygzqwvoqcyzbtbrbp
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Push database migrations
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: supabase db push

      - name: Deploy edge functions
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          supabase functions deploy create-checkout
          supabase functions deploy create-portal
          supabase functions deploy stripe-webhook
          supabase functions deploy sync-subscription
          supabase functions deploy delete-account
          supabase functions deploy strava-callback
          supabase functions deploy strava-sync
          supabase functions deploy strava-disconnect
          supabase functions deploy strava-activity-detail
          supabase functions deploy buddy-phone-otp
          supabase functions deploy ensure-referral-code
          supabase functions deploy welcome-email
          supabase functions deploy marketing-cron
          supabase functions deploy marketing-event
          supabase functions deploy reactivate-nonpayers

      - name: Skip notice (secrets missing)
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: |
          echo "::warning::SUPABASE_ACCESS_TOKEN not set — add GitHub repo secret to auto-deploy Supabase on push to main."
          echo "Project ref: ssdygzqwvoqcyzbtbrbp"
