    <style>
      html, body, #root {
        margin: 0;
        min-height: 100%;
        background: #000514;
      }
      .myswym-boot {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #000514;
        font-family: Geist, ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        color: #f4f8fa;
      }
      .myswym-boot-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: min(280px, 86vw);
        animation: myswym-boot-in 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .myswym-boot-icon-wrap {
        width: 88px;
        height: 88px;
        border-radius: 24px;
        overflow: hidden;
        background: #000;
        box-shadow: 0 0 48px rgba(0, 107, 253, 0.42);
      }
      .myswym-boot-icon {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .myswym-boot-wordmark {
        display: block;
        height: 28px;
        width: auto;
        max-width: 200px;
        margin-top: 22px;
        object-fit: contain;
      }
      .myswym-boot-status {
        margin: 18px 0 0;
        font-size: 14px;
        font-weight: 400;
        line-height: 1.4;
        text-align: center;
        color: #b4c6db;
      }
      .myswym-boot-track {
        width: 168px;
        height: 4px;
        margin-top: 28px;
        border-radius: 999px;
        background: rgba(0, 107, 253, 0.18);
        overflow: hidden;
      }
      .myswym-boot-bar {
        height: 100%;
        width: 22%;
        border-radius: inherit;
        background: #006bfd;
        animation: myswym-boot-bar 2.6s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .myswym-boot-label {
        margin: 36px 0 0;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(155, 176, 200, 0.7);
      }
      @keyframes myswym-boot-in {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes myswym-boot-bar {
        0% { width: 10%; }
        45% { width: 58%; }
        100% { width: 86%; }
      }
      @media (prefers-reduced-motion: reduce) {
        .myswym-boot-inner,
        .myswym-boot-bar {
          animation: none !important;
        }
        .myswym-boot-bar { width: 40%; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="myswym-boot" role="status" aria-live="polite" aria-busy="true">
        <div class="myswym-boot-inner">
          <div class="myswym-boot-icon-wrap">
            <img class="myswym-boot-icon" src="/apple-touch-icon.png" alt="" width="88" height="88" />
          </div>
          <img class="myswym-boot-wordmark" src="/logo-myswym-banner-blanc.png" alt="mySWYM" height="28" width="192" />
          <p class="myswym-boot-status">Préparation de votre espace nageur</p>
          <div class="myswym-boot-track" aria-hidden="true"><div class="myswym-boot-bar"></div></div>
          <p class="myswym-boot-label">Un instant</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
