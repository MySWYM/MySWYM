<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-32x32.png?v=3" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon.png?v=3" sizes="1024x1024" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, shrink-to-fit=no" />
    <meta name="theme-color" content="#9ec8f5" />
    <meta name="color-scheme" content="light" />
    <title>MySWYM : Personalized swim training plan</title>
    <meta name="description" content="Swim progression, triathlon, open water, diploma prep. Personalized swim training plan, ready in 2 minutes. 7-day Premium trial." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MySWYM" />
    <meta property="og:title" content="MySWYM : Personalized swim training plan" />
    <meta property="og:description" content="Swim progression, triathlon, open water, diploma prep. Personalized swim training plan, ready in 2 minutes. 7-day Premium trial." />
    <meta property="og:url" content="https://www.myswym.app/" />
    <meta property="og:image" content="https://www.myswym.app/og-share.png" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="fr_FR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MySWYM : Personalized swim training plan" />
    <meta name="twitter:description" content="Swim progression, triathlon, open water, diploma prep. Personalized swim training plan, ready in 2 minutes. 7-day Premium trial." />
    <meta name="twitter:image" content="https://www.myswym.app/og-share.png" />
    <link rel="canonical" href="https://www.myswym.app/" />
    <link rel="alternate" hreflang="en" href="https://www.myswym.app/" />
    <link rel="alternate" hreflang="fr" href="https://www.myswym.app/fr" />
    <link rel="alternate" hreflang="x-default" href="https://www.myswym.app/" />
    <script>
      (function () {
        try {
          var path = location.pathname || "/";
          var fr = path === "/fr" || path.indexOf("/fr/") === 0;
          var stored = "";
          try { stored = localStorage.getItem("i18nextLng") || ""; } catch (e) {}
          var bare = path.replace(/^\/fr(?=\/|$)/, "") || "/";
          var authFr =
            bare === "/connexion" || bare === "/inscription" ||
            bare === "/login" || bare === "/register" ||
            bare === "/app" || bare.indexOf("/app/") === 0;
          var useFr = fr || stored.indexOf("fr") === 0 || authFr;
          if (useFr) {
            document.documentElement.lang = "fr";
            if (bare === "/connexion" || bare === "/login") document.title = "Connexion | MySWYM";
            else if (bare === "/inscription" || bare === "/register") document.title = "Inscription | MySWYM";
            else if (bare === "/app" || bare.indexOf("/app/") === 0) document.title = "MySWYM";
            else document.title = "MySWYM : Plan d'entraînement natation personnalisé";
          } else {
            document.documentElement.lang = "en";
          }
        } catch (e) {}
        window.__MYSWYM_BOOT_AT = Date.now();
        document.addEventListener("gesturestart", function (e) { e.preventDefault(); }, { capture: true, passive: false });
        document.addEventListener("gesturechange", function (e) { e.preventDefault(); }, { capture: true, passive: false });
        document.addEventListener("touchmove", function (e) {
          if (e.touches && e.touches.length > 1) e.preventDefault();
        }, { capture: true, passive: false });
        try {
          var native = location.protocol === "capacitor:" || location.protocol === "ionic:"
            || (location.hostname === "localhost" && window.webkit && window.webkit.messageHandlers);
          if (native) {
            var p0 = location.pathname || "/";
            var keep = p0 === "/app" || p0.indexOf("/app/") === 0
              || p0 === "/connexion" || p0 === "/inscription"
              || p0 === "/login" || p0 === "/register";
            if (!keep) {
              try { history.replaceState(null, "", "/app" + (location.search || "") + (location.hash || "")); } catch (e) {}
            }
          }
          var path = location.pathname || "/";
          var p = path.replace(/\/+$/, "") || "/";
          var gif = native || p === "/app" || p.indexOf("/app/") === 0;
          if (!gif) document.documentElement.classList.add("myswym-boot-public");
          else document.documentElement.classList.remove("myswym-boot-public");
          if (gif) document.documentElement.classList.add("myswym-boot-screen");
          else document.documentElement.classList.remove("myswym-boot-screen");
          var theme = document.querySelector('meta[name="theme-color"]');
          if (theme) theme.setAttribute("content", gif ? "#006bfd" : "#9ec8f5");
          var warm = sessionStorage.getItem("myswym-boot-warm") === "1";
          if (!warm) {
            for (var i = 0; i < localStorage.length; i++) {
              var k = localStorage.key(i);
              if (k && k.indexOf("auth-token") !== -1) { warm = true; break; }
            }
          }
          if (warm) document.documentElement.classList.add("myswym-boot-warm");
        } catch (e) {}
      })();
    </script>
    <style>
      html, body, #root {
        margin: 0;
        min-height: 100%;
        background: #f7fafc;
        --myswym-accent: #006bfd;
        --myswym-ink: #0f1b2d;
      }
      html.myswym-boot-screen,
      html.myswym-boot-screen body,
      html.myswym-boot-screen #root {
        background: #006bfd;
      }
      .myswym-boot {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background:
          radial-gradient(ellipse 90% 50% at 50% -8%, rgba(126, 184, 245, 0.55), transparent 55%),
          linear-gradient(180deg, #d4e8fb 0%, #eef5fb 40%, #f4f8fc 100%);
        font-family: Geist, ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        color: var(--myswym-ink);
      }
      .myswym-boot-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: min(280px, 86vw);
      }
      .myswym-boot-stage {
        width: 200px;
        height: 200px;
        display: grid;
        place-items: center;
      }
      .myswym-boot-gif,
      .myswym-boot-still {
        display: block;
        width: 200px;
        height: 200px;
        object-fit: contain;
      }
      .myswym-boot-gif + .myswym-boot-still {
        display: none;
      }
      .myswym-boot-wordmark {
        display: block;
        height: 24px;
        width: auto;
        max-width: 168px;
        margin-top: 0;
        object-fit: contain;
        opacity: 1;
      }
      .myswym-boot-track {
        width: 72px;
        height: 2px;
        margin-top: 28px;
        border-radius: 1px;
        background: rgba(15, 27, 45, 0.12);
        overflow: hidden;
      }
      .myswym-boot-bar {
        display: block;
        height: 100%;
        width: 100%;
        transform-origin: center;
        background: var(--myswym-accent);
        animation: myswym-boot-bar 1.1s ease-in-out infinite;
      }
      @keyframes myswym-boot-bar {
        0%, 100% { transform: scaleX(0.22); opacity: 0.45; }
        50% { transform: scaleX(1); opacity: 1; }
      }
      .myswym-boot--app {
        background: var(--myswym-accent);
        color: #fff;
      }
      html:not(.myswym-boot-public) .myswym-boot:not(.myswym-boot--public) {
        background: var(--myswym-accent);
        color: #fff;
      }
      .myswym-boot--app .myswym-boot-wordmark,
      .myswym-boot-wordmark--app {
        margin-top: 0;
        height: 36px;
        max-width: min(168px, 46vw);
      }
      .myswym-boot-spin {
        position: fixed;
        left: 50%;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 92px);
        width: 28px;
        height: 28px;
        margin-left: -14px;
        border-radius: 50%;
        background: conic-gradient(from 0deg, rgba(255, 255, 255, 0) 0deg, rgba(255, 255, 255, 0) 48deg, #fff 300deg);
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2px));
        mask: radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2px));
        animation: myswym-boot-spin 0.8s linear infinite;
      }
      @keyframes myswym-boot-spin {
        to { transform: rotate(360deg); }
      }
      .myswym-boot-public-ui {
        display: none;
        flex-direction: column;
        align-items: center;
      }
      html.myswym-boot-public .myswym-boot-public-ui {
        display: flex;
      }
      html.myswym-boot-public .myswym-boot-app {
        display: none;
      }
      html:not(.myswym-boot-public) .myswym-boot-public-ui {
        display: none;
      }
      body:has(.myswym-boot) .ms-cookie-banner {
        display: none;
      }
      @media (prefers-reduced-motion: reduce) {
        .myswym-boot-gif { display: none; }
        .myswym-boot-gif + .myswym-boot-still { display: block; }
        .myswym-boot-bar {
          animation: none;
          transform: scaleX(0.4);
          opacity: 1;
        }
        .myswym-boot-spin { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="myswym-boot" role="status" aria-live="polite" aria-busy="true" aria-label="Chargement">
        <div class="myswym-boot-inner">
          <div class="myswym-boot-app">
            <img class="myswym-boot-wordmark myswym-boot-wordmark--app" src="/logo-myswym-banner-blanc.png" alt="" height="36" width="155" />
            <div class="myswym-boot-spin" aria-hidden="true"></div>
          </div>
          <div class="myswym-boot-public-ui">
            <img class="myswym-boot-wordmark" src="/logo-myswym-on-light.png" alt="" height="24" width="103" />
            <div class="myswym-boot-track" aria-hidden="true"><span class="myswym-boot-bar"></span></div>
          </div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var el = document.querySelector(".myswym-boot");
        if (el && document.documentElement.lang !== "fr") el.setAttribute("aria-label", "Loading");
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
