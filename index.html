<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-32x32.png?v=2" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon.png?v=2" sizes="1024x1024" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#355da3" />
    <title>MySWYM</title>
    <style>
      html, body, #root {
        margin: 0;
        min-height: 100%;
        background: #355da3;
      }
      .myswym-boot {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background:
          radial-gradient(120% 90% at 50% 28%, #4670b8 0%, #355da3 52%, #2a4d8c 100%);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        color: #fff;
      }
      .myswym-boot-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
        animation: myswym-boot-in 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .myswym-boot-mark {
        margin: 0;
        font-size: 21px;
        font-weight: 600;
        letter-spacing: 0.14em;
        line-height: 1;
        color: rgba(255, 255, 255, 0.96);
      }
      .myswym-boot-spinner {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 1.5px solid rgba(255, 255, 255, 0.2);
        border-top-color: rgba(255, 255, 255, 0.95);
        animation: myswym-boot-spin 0.92s linear infinite;
      }
      .myswym-boot-label {
        margin: 0;
        font-size: 13px;
        font-weight: 400;
        letter-spacing: 0.06em;
        color: rgba(255, 255, 255, 0.7);
      }
      @keyframes myswym-boot-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes myswym-boot-in {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        .myswym-boot-inner,
        .myswym-boot-spinner {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="myswym-boot" role="status" aria-live="polite" aria-busy="true">
        <div class="myswym-boot-inner">
          <p class="myswym-boot-mark">MySWYM</p>
          <div class="myswym-boot-spinner" aria-hidden="true"></div>
          <p class="myswym-boot-label">Loading</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
