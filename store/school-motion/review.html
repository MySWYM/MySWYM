<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>École · review motions + consignes</title>
<style>
  :root {
    --bg: #EAF3FA;
    --ink: #1F3B52;
    --muted: #5D7A90;
    --card: #FFFFFF;
    --line: #D6E8F4;
    --accent: #2E73A8;
    --ok: #1F7A4D;
    --ok-bg: #E8F6EE;
    --bad: #B42318;
    --bad-bg: #FDECEA;
    --warn: #9A6700;
    --warn-bg: #FFF6E0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: linear-gradient(180deg, #DCEEF9 0%, var(--bg) 28%, #F7FBFE 100%);
    color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 20; backdrop-filter: blur(10px);
    background: rgba(244, 249, 253, 0.9); border-bottom: 1px solid var(--line); padding: 12px 16px 10px; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 0 0 2px; }
  .lead { margin: 0; color: var(--muted); font-size: 13px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }
  .tabs button, .toolbtn {
    font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--card);
    color: var(--ink); border-radius: 999px; padding: 6px 12px; cursor: pointer;
  }
  .tabs button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .toolbtn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .stats { font-size: 12px; color: var(--muted); white-space: nowrap; }
  main { padding: 14px 16px 48px; }
  .step {
    display: grid; grid-template-columns: minmax(280px, 1.1fr) minmax(280px, 1fr);
    gap: 0; background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    overflow: hidden; margin-bottom: 14px; box-shadow: 0 8px 24px rgba(46, 115, 168, 0.06);
  }
  @media (max-width: 820px) { .step { grid-template-columns: 1fr; } }
  .anim-col { background: #F4F9FD; border-right: 1px solid var(--line); display: flex; flex-direction: column; }
  @media (max-width: 820px) { .anim-col { border-right: 0; border-bottom: 1px solid var(--line); } }
  .anim { width: 100%; aspect-ratio: 2/1; }
  .anim-meta { padding: 8px 12px 10px; font-size: 12px; color: var(--muted); }
  .copy { padding: 14px 16px 16px; }
  .kicker { font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); margin: 0 0 2px; }
  .title { font-size: 18px; margin: 0 0 10px; }
  .block { margin: 0 0 10px; }
  .block h3 { margin: 0 0 2px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); font-weight: 650; }
  .block p { margin: 0; font-size: 14px; }
  .motion-show { background: #F4F9FD; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin: 0 0 12px; }
  .motion-show h3 { margin: 0 0 2px; font-size: 11px; color: var(--accent); text-transform: uppercase; }
  .motion-show p { margin: 0; font-size: 13px; }
  .review { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 4px; }
  .flags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .flags button {
    font: inherit; font-size: 13px; border-radius: 999px; border: 1px solid var(--line);
    background: #fff; padding: 5px 11px; cursor: pointer;
  }
  .flags button[data-on="ok"] { background: var(--ok-bg); border-color: #9ED0B3; color: var(--ok); }
  .flags button[data-on="fix"] { background: var(--bad-bg); border-color: #F0B4AE; color: var(--bad); }
  .flags button[data-on="maybe"] { background: var(--warn-bg); border-color: #E8D39A; color: var(--warn); }
  textarea {
    width: 100%; min-height: 64px; resize: vertical; border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 10px; font: inherit; font-size: 13px; color: var(--ink);
    background: #FBFDFE;
  }
  .empty { color: var(--muted); padding: 40px 8px; text-align: center; }
  dialog {
    border: 1px solid var(--line); border-radius: 14px; padding: 0; max-width: 720px; width: calc(100% - 24px);
  }
  dialog::backdrop { background: rgba(20, 40, 60, 0.35); }
  .dlg { padding: 16px; }
  .dlg h2 { margin: 0 0 8px; font-size: 16px; }
  .dlg pre {
    margin: 0 0 12px; max-height: 50vh; overflow: auto; background: #F4F9FD;
    border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: 12px; white-space: pre-wrap;
  }
  .dlg-actions { display: flex; gap: 8px; justify-content: flex-end; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Review motions + consignes</h1>
    <p class="lead">Coche OK / Faux / À voir, note ce qui cloche. Export = copier pour Claude. Notes gardées dans ce navigateur.</p>
    <div class="toolbar">
      <div class="tabs" id="tabs"></div>
      <span class="stats" id="stats"></span>
      <button type="button" class="toolbtn" id="btnOnlyBad">Faux / À voir</button>
      <button type="button" class="toolbtn primary" id="btnExport">Exporter notes</button>
      <button type="button" class="toolbtn" id="btnClear">Effacer notes</button>
    </div>
  </div>
</header>
<main class="wrap" id="main"></main>
<dialog id="exportDlg">
  <div class="dlg">
    <h2>Notes à coller pour Claude</h2>
    <pre id="exportPre"></pre>
    <div class="dlg-actions">
      <button type="button" class="toolbtn" id="btnClose">Fermer</button>
      <button type="button" class="toolbtn primary" id="btnCopy">Copier</button>
    </div>
  </div>
</dialog>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
<script>
(async () => {
  const STORE_KEY = "myswym-school-motion-review-v1";
  const data = await (await fetch("_review-data.json")).json();
  const tabs = document.getElementById("tabs");
  const main = document.getElementById("main");
  const statsEl = document.getElementById("stats");
  const dlg = document.getElementById("exportDlg");
  const exportPre = document.getElementById("exportPre");
  let courseId = location.hash.slice(1) || data.courses[0]?.id || "crawl";
  let onlyBad = false;
  /** @type {Record<string, { status: string, note: string }>} */
  let notes = {};
  try { notes = JSON.parse(localStorage.getItem(STORE_KEY) || "{}") || {}; } catch { notes = {}; }

  let anims = [];

  function save() {
    localStorage.setItem(STORE_KEY, JSON.stringify(notes));
    renderStats();
  }

  function noteFor(stepId) {
    return notes[stepId] || { status: "", note: "" };
  }

  function setStatus(stepId, status) {
    const cur = noteFor(stepId);
    notes[stepId] = { ...cur, status: cur.status === status ? "" : status };
    save();
    const row = main.querySelector(`[data-step="${stepId}"]`);
    if (row) syncFlags(row, stepId);
  }

  function setNote(stepId, value) {
    notes[stepId] = { ...noteFor(stepId), note: value };
    save();
  }

  function syncFlags(row, stepId) {
    const st = noteFor(stepId).status;
    row.querySelectorAll(".flags button").forEach((b) => {
      b.dataset.on = b.dataset.status === st ? st : "";
    });
  }

  function renderStats() {
    const course = data.courses.find((c) => c.id === courseId);
    if (!course) return;
    let ok = 0, bad = 0, maybe = 0;
    for (const s of course.steps) {
      const st = noteFor(s.id).status;
      if (st === "ok") ok += 1;
      else if (st === "fix") bad += 1;
      else if (st === "maybe") maybe += 1;
    }
    statsEl.textContent = `${course.steps.length} étapes · OK ${ok} · Faux ${bad} · À voir ${maybe}`;
  }

  function destroyAnims() {
    anims.forEach((a) => { try { a.destroy(); } catch {} });
    anims = [];
  }

  function show() {
    destroyAnims();
    main.innerHTML = "";
    tabs.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.c === courseId)));
    const course = data.courses.find((c) => c.id === courseId);
    if (!course) {
      main.innerHTML = `<p class="empty">Cours inconnu.</p>`;
      return;
    }
    const steps = course.steps.filter((s) => {
      if (!onlyBad) return true;
      const st = noteFor(s.id).status;
      return st === "fix" || st === "maybe";
    });
    if (!steps.length) {
      main.innerHTML = `<p class="empty">${onlyBad ? "Aucun Faux / À voir sur ce cours." : "Aucune étape."}</p>`;
      renderStats();
      return;
    }
    for (const s of steps) {
      const n = noteFor(s.id);
      const art = document.createElement("article");
      art.className = "step";
      art.dataset.step = s.id;
      art.innerHTML = `
        <div class="anim-col">
          <div class="anim" aria-hidden="true"></div>
          <div class="anim-meta">${s.file || "pas de fichier"} · ${s.seconds != null ? s.seconds.toFixed(1) + " s" : "?"} · ${s.id}</div>
        </div>
        <div class="copy">
          <p class="kicker">${course.label} · étape ${s.n}</p>
          <h2 class="title">${escapeHtml(s.title)}</h2>
          ${s.show ? `<div class="motion-show"><h3>Ce que la motion doit montrer</h3><p>${escapeHtml(s.show)}</p></div>` : ""}
          <div class="block"><h3>Objectif</h3><p>${escapeHtml(s.objectif)}</p></div>
          <div class="block"><h3>Consigne</h3><p>${escapeHtml(s.cue)}</p></div>
          <div class="block"><h3>Bon si</h3><p>${escapeHtml(s.bonSi)}</p></div>
          <div class="block"><h3>Pas encore</h3><p>${escapeHtml(s.pasEncore)}</p></div>
          <div class="block"><h3>À éviter</h3><p>${escapeHtml(s.avoid)}</p></div>
          <div class="block"><h3>Dosage</h3><p>${escapeHtml(s.dosage)}</p></div>
          <div class="review">
            <div class="flags">
              <button type="button" data-status="ok">OK</button>
              <button type="button" data-status="false">Faux</button>
              <button type="button" data-status="maybe">À voir</button>
            </div>
            <textarea placeholder="Correction motion / consigne…">${escapeHtml(n.note)}</textarea>
          </div>
        </div>`;
      main.appendChild(art);
      syncFlags(art, s.id);
      art.querySelectorAll(".flags button").forEach((b) => {
        b.addEventListener("click", () => setStatus(s.id, b.dataset.status));
      });
      art.querySelector("textarea").addEventListener("input", (e) => setNote(s.id, e.target.value));
      if (s.file) {
        anims.push(lottie.loadAnimation({
          container: art.querySelector(".anim"),
          renderer: "svg",
          loop: true,
          autoplay: true,
          path: s.file,
        }));
      }
    }
    history.replaceState(null, "", "#" + courseId);
    renderStats();
  }

  function escapeHtml(str) {
    return String(str || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function buildExport() {
    const lines = ["# Corrections école motions / consignes", "", `Généré: ${new Date().toISOString()}`, ""];
    for (const course of data.courses) {
      const flagged = course.steps.filter((s) => {
        const n = noteFor(s.id);
        return n.status === "false" || n.status === "maybe" || (n.note && n.note.trim());
      });
      if (!flagged.length) continue;
      lines.push(`## ${course.label}`, "");
      for (const s of flagged) {
        const n = noteFor(s.id);
        const tag = n.status === "false" ? "FAUX" : n.status === "maybe" ? "À VOIR" : "NOTE";
        lines.push(`### ${s.n}. ${s.title} (\`${s.id}\` · \`${s.file || "?"}\`)`);
        lines.push(`- Statut: **${tag}**`);
        if (n.note.trim()) lines.push(`- Correction: ${n.note.trim()}`);
        lines.push(`- Consigne actuelle: ${s.cue}`);
        lines.push(`- Motion show: ${s.show || "(vide)"}`);
        lines.push("");
      }
    }
    if (lines.length <= 4) lines.push("_Aucune note pour l’instant._");
    return lines.join("\n");
  }

  for (const c of data.courses) {
    const b = document.createElement("button");
    b.dataset.c = c.id;
    b.textContent = `${c.label} (${c.steps.length})`;
    b.addEventListener("click", () => { courseId = c.id; show(); });
    tabs.appendChild(b);
  }

  document.getElementById("btnOnlyBad").addEventListener("click", () => {
    onlyBad = !onlyBad;
    document.getElementById("btnOnlyBad").textContent = onlyBad ? "Toutes" : "Faux / À voir";
    show();
  });
  document.getElementById("btnExport").addEventListener("click", () => {
    exportPre.textContent = buildExport();
    dlg.showModal();
  });
  document.getElementById("btnClose").addEventListener("click", () => dlg.close());
  document.getElementById("btnCopy").addEventListener("click", async () => {
    await navigator.clipboard.writeText(exportPre.textContent);
    document.getElementById("btnCopy").textContent = "Copié";
    setTimeout(() => { document.getElementById("btnCopy").textContent = "Copier"; }, 1200);
  });
  document.getElementById("btnClear").addEventListener("click", () => {
    if (!confirm("Effacer toutes les notes de review de ce navigateur ?")) return;
    notes = {};
    save();
    show();
  });

  if (!data.courses.some((c) => c.id === courseId)) courseId = data.courses[0].id;
  show();
})();
</script>
</body>
</html>
